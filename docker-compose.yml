services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      # Nginx runs on the VPS host; do not expose FastAPI publicly.
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /data/poll.sqlite3
    volumes:
      - poll_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  poll_data:
